name: Render pilot container verification
on:
  workflow_dispatch:
  push:
    branches: [codex/credential-security-lab]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - 'backend/**'
      - 'frontend/**'
      - 'companion/extension/**'
      - 'companion/package_extension.py'
      - 'companion/helper_*.py'
      - 'companion/build_helper*.py'
      - 'companion/*build-requirements.txt'
      - 'deploy/build_release.py'
      - 'tests/test_helper_status.py'
      - 'tests/test_deploy_release.py'
      - 'tests/test_build_provenance.py'
      - 'deploy/postgres*.py'
      - 'tests/test_postgres*.py'
      - '.github/workflows/render-container.yml'
permissions:
  contents: read
jobs:
  postgres:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelops_migration_test
          POSTGRES_PASSWORD: disposable-ci-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U sentinelops_migration_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare local-only disposable PostgreSQL fixture
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'sentinelops-postgres-fixture'
          root.mkdir(mode=0o700)
          key=root/'password'
          key.write_text('disposable-ci-fixture-only')
          key.chmod(0o600)
          config=root/'config.json'
          config.write_text(json.dumps({'host':'127.0.0.1','port':15439,'password_file':str(key)}))
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('SENTINEL_TEST_PG_CONFIG='+str(config)+'\n')
          PY
      - name: Verify real PostgreSQL workflows, migrations and backup recovery
        run: python -m pytest tests/test_postgres_schema.py tests/test_postgres_store.py tests/test_postgres_app.py tests/test_postgres_backups.py tests/test_postgres_backup_pull.py tests/test_backups.py tests/test_offserver_backup.py -q
      - name: Verify helper source binding and release stale-build guards
        run: python -m pytest tests/test_helper_status.py tests/test_deploy_release.py tests/test_build_provenance.py -q
      - name: Verify agency execution, crash recovery and removed-member cryptography
        run: python -m pytest tests/test_access_workflows.py tests/test_access_leases.py tests/test_handoffs.py tests/test_access_reviews.py tests/test_proof_packs.py tests/test_shared_offboarding_crypto.py -q
  container:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the deployment Dockerfile without secrets
        run: docker build --tag sentinelops-pilot-check .
      - name: Check packaged extension and non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id sentinelops-pilot-check -u)" != 0
          docker run --rm --entrypoint python sentinelops-pilot-check -c 'import json,zipfile; from pathlib import Path; archive=zipfile.ZipFile("companion/extension/sentinelops-companion.zip"); assert json.loads(archive.read("manifest.json"))["version"]==json.loads(Path("companion/extension/public/manifest.json").read_text())["version"]; assert Path("frontend/dist/index.html").is_file(); import backend.postgres_backups; print("Container files and archive verified.")'
      - name: Start an isolated disposable app and verify HTTP startup
        run: |
          docker run --detach --name sentinelops-pilot-check --publish 127.0.0.1:18110:8110 sentinelops-pilot-check
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(45):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18110/api/status',timeout=2) as response:
                      status=json.load(response)
                  assert status['setup_required'] is True
                  with urllib.request.urlopen('http://127.0.0.1:18110/',timeout=2) as response:
                      assert response.status==200 and b'<html' in response.read().lower()
                  print('Disposable container HTTP startup and frontend verified.')
                  break
              except (OSError,TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit('Container startup failed.')
          PY
      - name: Failure diagnostics
        if: failure()
        run: docker logs sentinelops-pilot-check || true
      - name: Remove disposable container
        if: always()
        run: docker rm --force sentinelops-pilot-check || true

  extension:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked development dependencies
        run: npm --prefix frontend ci
      - name: Build the real companion
        run: npm --prefix frontend run build:companion
      - name: Install official test Chromium and Linux dependencies
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Verify isolated extension messaging against synthetic HTTPS fixtures
        run: npm --prefix frontend run test:extension

  sharing-browser:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install locked application and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Verify two-account sharing and new-key isolation against the real local application
        run: npm --prefix frontend run test:acceptance
