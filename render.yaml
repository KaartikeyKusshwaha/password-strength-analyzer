services:
  - type: web
    name: sentinelops-pilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADVANCED_UI
        value: "false"
